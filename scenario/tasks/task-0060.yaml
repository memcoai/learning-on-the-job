expected_obligations:
- policy: non-returnable-categories
  obligation: The 24 fall-arrest harnesses are PPE and the customer has not stated whether
    their packaging has been opened, so returnability cannot be decided from what is known.
    The reply must ask the customer to confirm the packaging condition before the return is
    accepted or refused, and must not confirm acceptance or refuse outright. If the reply
    explains the opened-packaging outcome, the refusal ground is the PPE category, named as
    such, and no goodwill credit may be offered as a substitute for an ineligible return.
- policy: restocking-fee
  obligation: If the return proceeds once the packaging is confirmed unopened, it carries
    a fee of 7.5% of the £2,028 goods value, which comes to £152.10, and the fee is not
    waived; any statement of the fee in the reply is conditional on that confirmation, not
    a confirmation of acceptance.
- policy: complaint-route
  obligation: Because the customer states dissatisfaction and asks to complain about ord-3397,
    the reply must name Rowan Ellis, the order-desk manager, as the complaints route and state
    that Rowan will respond within two working days, alongside addressing the requested return.
- policy: returns-window
  obligation: Because ord-3397 was delivered on 8 September and today is 14 September, 6 days
    have elapsed; acc-133 is not tier A, so the ordinary 24-day window governs and timing does
    not bar the return. The tier-A extension to 38 days is applied only to eligible accounts and
    must not be mentioned to this customer.
- policy: order-reference-line
  obligation: ord-3397 named in the first sentence.
- policy: sign-off-house-style
  obligation: ends "Fenmoor Supplies order desk" then acc-133, nothing after.
