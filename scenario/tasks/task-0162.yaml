expected_obligations:
- policy: damage-shortage-window
  obligation: The damage and shortage were reported on 14 September, 16 working days after
    delivery on 21 August, so the four-working-day window is closed. The reply must give that
    window as the reason Fenmoor cannot raise a claim and route the customer to the carrier's
    claims process, rather than ask for photographs or offer a credit or replacement.
- policy: restocking-fee
  obligation: The correctly supplied goods being returned are subject to a restocking fee
    of 7.5% of the £1,264.30 goods value, which comes to £94.82; the reply must state that
    fee and amount. The fee is not waived for the correctly supplied goods merely because
    this is a tier-B account, while the damaged bin is covered by the damage exception and
    does not attract the fee.
- policy: returns-window
  obligation: The delivery date was 21 August and 24 days have elapsed by 14 September, so
    the ordinary 24-day window for this non-tier-A account still applies and the return is
    accepted. The tier-A 38-day extension is applied only to tier-A accounts and must not
    be mentioned to this customer.
- policy: order-reference-line
  obligation: ord-3383 named in the first sentence.
- policy: sign-off-house-style
  obligation: ends "Fenmoor Supplies order desk" then acc-122, nothing after.
