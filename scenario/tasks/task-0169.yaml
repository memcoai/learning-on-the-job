    customer's urgency and this order's value do not qualify for a waiver.
- policy: cancellation-cutoff
  obligation: Order ord-3445 is currently before picking, so cancellation is free and, if
    the customer chooses cancellation, the reply must confirm it without applying a cancellation
    fee.
- policy: order-reference-line
  obligation: ord-3445 named in the first sentence.
- policy: sign-off-house-style
