expected_obligations:
- policy: payment-terms-by-tier
  obligation: Because account acc-110 is tier-A and the customer is asking for longer to pay,
    the reply must state the applicable terms of 45 days from invoice and pass the request
    to credit control with a two-working-day response commitment. It must not offer extended,
    negotiated or one-off terms, move an invoice due date, or predict what credit control
    will decide.
- policy: expedite-surcharge
  obligation: Because the customer is asking for expedited delivery, any expedited delivery
    offered or agreed must state the £68 surcharge per consignment and explicitly say that
    it is waived. The waiver applies because acc-110 is tier-A and has 12 years' tenure; order
    value, volume and urgency must not be given as reasons.
- policy: order-release-threshold
  obligation: For ord-3421, the settled total is £2,641.45 against an order total including
    VAT and delivery of £2,951.34, so release does not yet follow and £14.76 more is required.
    The reply must confirm the settled amount and remaining balance, must not quote the 90%
    threshold, and must not commit to dispatch or give any dispatch timing.
- policy: order-reference-line
  obligation: ord-3421 named in the first sentence.
- policy: sign-off-house-style
  obligation: ends "Fenmoor Supplies order desk" then acc-110, nothing after.
