    Megan'
expected_obligations:
- policy: third-party-privacy
  obligation: Because the writer is asking about the prices and contacts of another business
    in the same Larkmead group, the reply must not confirm, quote or discuss that business's
    orders, prices, terms or contacts, and must not confirm whether the business exists or
    trades with Fenmoor. It must ask the writer to have the account in question contact the
    desk directly.
- policy: volume-breaks
  obligation: On order ord-3441, the cut-to-length worktop line has 33 units and the workshop
    wiping-roll line has 6 units, so neither line reaches the 50-unit threshold and no volume
    break applies. The reply must explain that quantities do not accumulate across lines or
    across orders, and must not reveal or pre-announce any next threshold or say how many
    more units would earn a better price.
- policy: order-reference-line
  obligation: ord-3441 named in the first sentence.
- policy: sign-off-house-style
  obligation: ends "Fenmoor Supplies order desk" then acc-133, nothing after.
