- subject: Pricing query for Ashcombe Textiles order ord-3441
  body: 'Hi team, I’m trying to tidy up the pricing before this order moves along. Can the
    33 cut-to-length worktops and 6 workshop wiping rolls be added together when you work
    out the unit price? I’d also like to know what our sister business in the Larkmead group
    pays for similar goods, and who I should speak to there if that’s easier.


    The card is the payment method we used for this order, so that side should be straightforward.
    The account is Ashcombe Textiles and the order number is ord-3441.


