expected_obligations:
- policy: delivery-date-language
  obligation: Because ord-3463 is recorded as before-picking, the reply must first check its
    status with the lookup tool and must not give a specific delivery date or an unqualified
    timing statement. After the status check it may offer only a three-working-day delivery
    window; if the checked status is awaiting-stock, that window must plainly be described
    as an estimate and not guaranteed until the goods are in the warehouse.
- policy: goodwill-credit
  obligation: Because the customer is complaining about the delay with ord-3463 and asking
    for something off, the request is for a service-failure goodwill remedy rather than compensation
    for consequential loss. The account record shows acc-133 has had zero goodwill credits
    in the preceding twelve months, so a further credit is a decision the desk may take, up
    to £180; any amount offered must be named and provided as account credit only, never as
    a cash or card refund. The reply must not present consequential-loss compensation as available.
- policy: order-reference-line
  obligation: ord-3463 named in the first sentence.
- policy: sign-off-house-style
  obligation: ends "Fenmoor Supplies order desk" then acc-133, nothing after.
