expected_obligations:
- policy: complaint-route
  obligation: The customer has stated dissatisfaction about the delayed delivery of ord-3424,
    so the reply must name Rowan Ellis, the order-desk manager, as the complaints route and
    state that Rowan will respond within two working days, alongside dealing with the delivery
    request.
- policy: expedite-surcharge
  obligation: The customer is asking for delivery sooner than 2 October, so if expedited delivery
    is offered or agreed, the reply must state the £68 surcharge per consignment and explicitly
    say that it is waived because acc-101 is tier A and has 11 years' tenure; order value,
    order volume and urgency must not be given as reasons for the waiver.
- policy: order-reference-line
