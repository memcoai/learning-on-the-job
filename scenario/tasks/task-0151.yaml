expected_obligations:
- policy: credit-hold-handling
  obligation: 'Because account acc-106 has credit status on-hold, the reply is the referral
    alone: it must say that the request has been passed to the accounts team and that they
    will be in touch within one working day. The on-hold status must not be disclosed to the
    customer, no reason may be given, and no order acceptance, change confirmation, dispatch
    commitment or arrival timing may be provided. No timing of any kind about the order may
    appear, including dates, windows, or a statement that timing cannot be given; the only
    permitted timing is that the accounts team will be in touch within one working day.'
- policy: order-reference-line
