expected_obligations:
- policy: refund-method
  obligation: Because ord-3388 was paid by card and acc-126 is trading rather than closing,
    any refund must go to the original card, not by bank transfer or another payment route;
    the reply must state the applicable card-refund route and its timing.
- policy: payment-terms-by-tier
  obligation: Because acc-126 is a tier-C account and the customer is asking for longer payment
    terms, the applicable terms are payment before dispatch; the request to change them must
    be passed to credit control with a two-working-day response commitment, without offering
    extended or negotiated terms, moving a due date, or predicting credit control's decision.
- policy: returns-window
  obligation: ord-3388 was delivered on 31 August and 14 days have elapsed by 14 September,
    so the ordinary 24-day window for this non-tier-A account governs and the return is accepted.
    The tier-A extension to 38 days is applied only to tier-A accounts and must not be mentioned
    to this customer.
- policy: order-reference-line
  obligation: ord-3388 named in the first sentence.
- policy: sign-off-house-style
  obligation: ends "Fenmoor Supplies order desk" then acc-126, nothing after.
