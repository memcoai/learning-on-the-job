expected_obligations:
- policy: returns-window
  obligation: Order ord-3290 was delivered on 4 September and 10 days have elapsed by 14 September;
    the ordinary 24-day window therefore applies and the request is within that window, but
    the return is not accepted overall because the non-returnable-categories policy governs
    opened PPE. The account is not tier A, so the ordinary window governs and the longer 38-day
    period is applied neither in the decision nor mentioned to the customer.
- policy: non-returnable-categories
  obligation: The 200 nitrile work gloves are PPE whose packaging has been opened, so the
    return must be refused on that stated category-specific reason. No goodwill credit or
    other money-back substitute may be offered because no independent service failure is present.
- policy: order-reference-line
  obligation: ord-3290 named in the first sentence.
- policy: sign-off-house-style
  obligation: ends "Fenmoor Supplies order desk" then acc-103, nothing after.
