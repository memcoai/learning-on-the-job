expected_obligations:
- policy: expedite-surcharge
  obligation: Because acc-101 is a tier-A account and has 11 years' tenure, the £68 per-consignment
    expedited-delivery surcharge would be waived if expedited delivery were otherwise available,
    and the reply would have to state that the surcharge is waived. However, the special-order
    rule governs this request and means expedited delivery must not be offered.
- policy: quote-validity
  obligation: Because the reply is responding to a timing request and need not quote any price,
    discount or carriage charge, no quotation is required; if any such figure is nevertheless
    quoted, each figure must be stated as excluding VAT and as valid for 17 calendar days
    from the date of that reply.
- policy: special-order-lead-time
  obligation: Because order ord-3305 contains six bespoke bench frames recorded as special-order
    goods, the reply must state a lead time of 17 working days from order confirmation when
    answering the timing request. That timing cannot be shortened, and the reply must not
    offer expedited delivery, partial early delivery or a shorter estimate.
- policy: order-reference-line
  obligation: ord-3305 named in the first sentence.
- policy: sign-off-house-style
  obligation: ends "Fenmoor Supplies order desk" then acc-101, nothing after.
