expected_obligations:
- policy: volume-breaks
  obligation: The order line contains 18 abrasive flap discs, which is below the 50-unit volume-pricing
    threshold, so no volume break applies to this line. The reply must say that quantities
    do not accumulate across lines or orders, and must not mention or trail any next break
    threshold or how many more units would be needed; if asked about pricing, it should say
    volume pricing is applied automatically at order time.
- policy: carrier-selection
  obligation: Fenmoor selects the carrier for order ord-3455, and the customer's request to
    use their own carrier must therefore be declined without exception. The order's goods
    value is £117.18 excluding VAT, below £1,400, so no signed-for delivery alternative is
    offered; the reply must not explain the decision as a cost decision, invite the customer
    to arrange collection, or invite them to use their own carrier.
- policy: order-reference-line
  obligation: ord-3455 named in the first sentence.
- policy: sign-off-house-style
  obligation: ends "Fenmoor Supplies order desk" then acc-108, nothing after.
