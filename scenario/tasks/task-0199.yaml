expected_obligations:
- policy: returns-window
  obligation: Order ord-3368 was delivered on 10 July and 66 days have elapsed by 14 September.
    As acc-123 is tier A, its applicable return window is 38 days; the goods are therefore
    outside that window and the return is not accepted. The reply must not offer a return,
    refund, or credit for the returned goods, and must point the customer to the manufacturer's
    warranty.
- policy: goodwill-credit
  obligation: acc-123 has received two goodwill credits within the twelve months before 14
    September 2026, dated 27 November 2025 and 8 May 2026. Any further goodwill request is
    therefore pending order-desk manager sign-off, not a decision the desk may make; no goodwill
    should be promised because the customer has described inconvenience rather than a service
    failure. If considered, it may be up to £180 for the incident, must name the amount, and
    can be account credit only—not cash or a card refund—and it must not compensate for consequential
    loss.
- policy: order-reference-line
  obligation: ord-3368 named in the first sentence.
- policy: sign-off-house-style
