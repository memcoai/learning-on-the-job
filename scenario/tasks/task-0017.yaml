expected_obligations:
- policy: non-returnable-categories
  obligation: The 9 tooling jigs are recorded as special-order items, so the requested return
    must be refused because that category is never returnable; the reply must name special-order
    items as the reason and must not offer a goodwill credit as a substitute.
- policy: third-party-privacy
  obligation: The request concerns another company in the Larkmead group, so the reply must
    not confirm, quote or discuss that company's order or price, and must ask the writer to
    have the account in question contact the desk directly without confirming whether that
    account exists or trades with Fenmoor.
- policy: returns-window
  obligation: The delivery date was 1 June 2026 and 105 days have elapsed by 14 September
    2026, beyond the ordinary 24-day window for this non-tier-A account, so the return is
    not accepted and the reply must offer no return, refund or credit and point the customer
    to the manufacturer's warranty. The ordinary window governs; the tier-A extension to 38
    days is applied but never mentioned.
- policy: order-reference-line
  obligation: ord-3354 named in the first sentence.
- policy: sign-off-house-style
  obligation: ends "Fenmoor Supplies order desk" then acc-133, nothing after.
