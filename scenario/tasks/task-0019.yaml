  obligation: Because order ord-3468 is currently before-picking, the reply must check its
    status with the lookup tool before giving any delivery indication, then offer a three-working-day
    delivery window without committing to a specific delivery date or giving a bare date.
- policy: order-reference-line
  obligation: ord-3468 named in the first sentence.
- policy: sign-off-house-style
