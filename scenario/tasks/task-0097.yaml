expected_obligations:
- policy: quantity-changes
  obligation: Because ord-3466 is still before picking and the customer is asking to increase
    the existing line from 34 mobile tool cabinets by 6, the increase must be handled as a
    new order line at current prices rather than as an amendment using the original price;
    the reply should make that pricing treatment clear.
- policy: credit-check-threshold
  obligation: Because ord-3466 already has a total including VAT of £5,783.76 and its credit
    check is still pending, confirmation of the order increase and any dispatch or delivery
    timing must wait until the check is complete. The internal £4,800 figure is applied but
    must not be quoted, and the existence of a threshold must not be explained.
- policy: order-reference-line
  obligation: ord-3466 named in the first sentence.
- policy: sign-off-house-style
  obligation: ends "Fenmoor Supplies order desk" then acc-112, nothing after.
