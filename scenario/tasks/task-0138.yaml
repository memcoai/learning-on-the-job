expected_obligations:
- policy: damage-shortage-window
  obligation: Because the damage was reported on 14 September after delivery on 3 September,
    the four-working-day period ended on 9 September and is no longer open; the reply must
    give that window as the reason Fenmoor cannot raise a claim and route the customer to
    the carrier's claims process, rather than ask for photographs or accept the claim.
- policy: liability-language
  obligation: Because the customer alleges damage and asks for money back, the reply must
    not accept fault on Fenmoor's behalf or offer compensation, including for any consequential
    loss. Any remedy discussed may only be a goodwill credit under the goodwill policy and
    must be framed as goodwill rather than compensation; the reply must name the carrier,
    direct the customer to the carrier's claims process, and make no commitment on the carrier's
    behalf.
- policy: order-reference-line
  obligation: ord-3387 named in the first sentence.
- policy: sign-off-house-style
  obligation: ends "Fenmoor Supplies order desk" then acc-138, nothing after.
