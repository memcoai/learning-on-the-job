expected_obligations:
- policy: quote-validity
  obligation: Because the customer asks for confirmation of the £700 goods price and £30 delivery
    charge on order 3310, any price, discount or carriage charge quoted in the reply must
    be stated as excluding VAT and as valid for 17 calendar days from the date of that reply;
    this must also be done if either figure is merely repeated.
- policy: goodwill-credit
  obligation: 'Because the customer asks for something off for the trouble caused by order
    3310 still being shown as picking, the goodwill request concerns a service issue. The
    account record shows 0 goodwill credits in the preceding twelve months, so a further goodwill
    credit is a decision the desk may take: it may be up to £180 per incident, the amount
    must be named, and it must be offered as account credit only, never as a cash or card
    refund; it is not compensation for consequential loss.'
- policy: order-reference-line
