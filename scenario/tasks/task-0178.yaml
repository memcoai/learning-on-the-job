expected_obligations:
- policy: quote-validity
  obligation: Because the customer is asking for the current price for the same quantity,
    any price, discount or carriage charge quoted in the reply must be stated as excluding
    VAT and as valid for 17 calendar days from the date of that reply; both details are required
    for every quoted figure, including the repeated £7.45 price.
- policy: volume-breaks
  obligation: Because the order line in ord-3381 contains 26 units, the 50-unit volume break
    does not apply to that line. The reply must make clear that quantities do not accumulate
    across lines or orders, and it must not mention or disclose the next break threshold or
    how many more units would be needed.
- policy: order-reference-line
