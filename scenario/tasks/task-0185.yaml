expected_obligations:
- policy: refund-method
  obligation: Because ord-3393 was placed on invoice terms and acc-121 is trading rather than
    closing, any refund that is due must be issued as account credit rather than as a payment
    out. The reply must state that applicable route and must not offer cash, a cheque, or
    a transfer to another card; the twelve-working-day bank-transfer timing does not apply.
- policy: returns-window
  obligation: The order was delivered on 11 September 2026 and three days have elapsed by
    14 September 2026. The account's applicable tier-A return window is 38 days, so the request
    is within the window, but the return is not accepted because the goods are cut to length.
    The 38-day extension is applied internally and must not be advertised to the customer.
- policy: non-returnable-categories
  obligation: The requested goods are steel angle cut to size, which is the never-returnable
    cut-to-length category, so the reply must refuse the return on that specific ground. No
    goodwill credit may be offered as a substitute because the records show no independent
    service failure.
- policy: order-reference-line
  obligation: ord-3393 named in the first sentence.
- policy: sign-off-house-style
