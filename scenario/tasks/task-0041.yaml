expected_obligations:
- policy: no-discount-categories
  obligation: The order is for chainsaw protective trousers in the safety-critical PPE category,
    so no discount, promotion or goodwill-motivated price reduction may be offered; state
    that exclusion factually and do not present it as negotiable or route it to sales.
- policy: delivery-date-language
  obligation: The customer is asking for delivery timing, so first check order ord-3408's
    status with the lookup tool; after that check, do not commit to a specific delivery date
    and offer only a three-working-day window. If the checked status is awaiting-stock, clearly
    say the window is an estimate and is not guaranteed until the goods are in the warehouse.
- policy: order-release-threshold
  obligation: Order ord-3408 has £2,860.12 in settled funds, so the settled total must be
    acknowledged and the further £94.01 required for release must be stated; release does
    not follow yet because the cleared amount is below the required threshold. The reply must
    not commit to dispatch or give dispatch timing, and the 90% threshold is applied but never
    quoted to the customer.
