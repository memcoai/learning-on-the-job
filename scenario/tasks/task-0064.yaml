    the same sort of pallet racking beams at a lower price. Can you match it or do something
    about the difference? I’d also like to complain, as this has been a frustrating experience.


    Regards,

    Martin Cole'
- subject: Could you check ord-3379 please
  body: 'Morning,


    Please can someone look into ord-3379? We paid £2,864.27 in total and received the delivery
    on 31 July, but I’ve since found a lower price online and have attached a screenshot from
    an online shop. I’m asking whether you can match the price shown. I’m disappointed that
    I have had to chase this and would like to complain as well.


    Thanks,

    Helen'
- subject: ord-3379 – lower price found online
  body: 'Hello,


    I’m not especially happy about the price on ord-3379. The total on our invoice is £2,864.27,
    and the order was delivered on 31 July. I have attached a screenshot from an online shop
    showing the pallet racking beams cheaper elsewhere. Is there anything you can do to match
