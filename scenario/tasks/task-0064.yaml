    Best wishes,

    Daniel Price'
expected_obligations:
- policy: price-match
  obligation: The customer is asking Fenmoor to match a lower price and has offered a screenshot
    from an online shop, which is marketplace or consumer-site evidence and does not count.
    The reply must say that this evidence is not accepted, ask for a written quote from a
    trade distributor if the customer wants the request considered, and pass the request to
    the sales team. The desk must not agree the match, decline it, or estimate the outcome;
    sales will respond within two working days.
- policy: complaint-route
  obligation: The customer has stated dissatisfaction and asked to complain about ord-3379,
    so the reply must name Rowan Ellis, the order-desk manager, as the complaints route and
    state that Rowan will respond within two working days, alongside handling the price request.
- policy: order-reference-line
  obligation: ord-3379 named in the first sentence.
- policy: sign-off-house-style
  obligation: ends "Fenmoor Supplies order desk" then acc-105, nothing after.
