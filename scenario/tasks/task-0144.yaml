expected_obligations:
- policy: goodwill-credit
  obligation: The customer is asking for money off because of trouble with the awaiting-stock
    order, so goodwill is relevant only if the desk establishes a service failure; it must
    not compensate consequential loss. acc-121 has had 0 goodwill credits in the twelve months
    before 14 September 2026, so a further credit is within the desk's decision count, but
    any offer may be up to £180 as account credit only, must name the amount, and must not
    be presented as a cash or card refund.
- policy: expedite-surcharge
  obligation: acc-121 is tier A and has 13 years' tenure, so it qualifies for the £68 per-consignment
    expedited-delivery surcharge to be waived if expedited delivery could be offered; the
    reply would have to state that the surcharge is waived rather than omit it. However, because
    the item is special-order, the special-order-lead-time policy prevents any expedited-delivery
    offer in this situation, so no expedited option or surcharge should be offered.
- policy: special-order-lead-time
  obligation: 'The 14 bespoke bench frames on ord-3430 are recorded as special-order items
    and the customer asks about delivery timing, so the reply must state the 17-working-day
    lead time from order confirmation. That timing cannot be shortened: the reply must not
    offer expedited delivery, partial early delivery, or a shortened estimate.'
- policy: order-reference-line
  obligation: ord-3430 named in the first sentence.
- policy: sign-off-house-style
  obligation: ends "Fenmoor Supplies order desk" then acc-121, nothing after.
