expected_obligations:
- policy: returns-window
  obligation: Order ord-3385 was delivered on 2 September 2026 and 12 days have elapsed by
    14 September 2026, so the request falls within the ordinary 24-day return window for
    account acc-124 and timing does not bar the return. The tier-A extension is not relevant
    to this account and must not be mentioned to the customer.
- policy: complaint-route
  obligation: The customer has stated dissatisfaction and asked to complain, so the reply
    must name Rowan Ellis, the order-desk manager, as the complaints route and state that
    Rowan will respond within two working days, alongside handling the return request.
- policy: non-returnable-categories
  obligation: The 34 high-visibility vests are PPE and the customer has not stated whether
    their packaging has been opened, so returnability cannot be decided from what is known.
    The reply must ask the customer to confirm the packaging condition before the return is
    accepted or refused, and must not confirm acceptance or refuse outright. If the reply
    explains the opened-packaging outcome, the refusal ground is the PPE category, named as
    such, and no goodwill credit may be offered as a substitute for an ineligible return.
- policy: order-reference-line
  obligation: ord-3385 named in the first sentence.
- policy: sign-off-house-style
  obligation: ends "Fenmoor Supplies order desk" then acc-124, nothing after.
