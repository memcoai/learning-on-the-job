variants:
- subject: Order ord-3449
  body: 'Hi,


    The tools, fixings and guarding panels in order ord-3449 are needed for work currently
    under way at our site. Could you let me know whether the items that are ready can be sent
    first, with the remainder to follow?


    Regards,

    Helen'
