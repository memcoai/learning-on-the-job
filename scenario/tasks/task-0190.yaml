expected_obligations:
- policy: refund-method
  obligation: Because order ord-3388 was paid for by card and account acc-126 is trading rather
    than closing, any refund must go to the original card. The reply must state that route
    and the applicable timing, and must not offer cash, a cheque, an account credit, or a
    transfer to another card.
- policy: returns-window
  obligation: Because order ord-3388 was delivered on 31 August and 14 days have elapsed by
    14 September, the return is within the ordinary 24-day window and is accepted. Account
    acc-126 is not tier A, so the ordinary window governs; the 38-day extension is applied
    only to tier-A accounts and must not be mentioned.
