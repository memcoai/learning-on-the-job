expected_obligations:
- policy: refund-method
  obligation: Because ord-3324 was paid for by card and the customer is asking for money back,
    any refund must go to the original card, and the reply must state that route and the applicable
    timing. It must not offer cash, a cheque, a bank transfer, or a transfer to a different
    card.
- policy: volume-breaks
  obligation: The line in ord-3324 contains 6 thermal curtain strips, so the 50-unit volume
    break does not apply. The reply must state that quantities do not accumulate across lines
    or orders, and must not mention or trail the next break threshold regardless of what the
    customer asks.
- policy: quote-validity
  obligation: If the reply includes any price, discount, or carriage charge, each such figure
    must be stated as excluding VAT and as valid for 17 calendar days from the date of that
    reply; this applies even if a previously quoted figure is repeated.
- policy: returns-window
  obligation: The six stocked consumables were delivered on 8 September 2026 and 6 calendar
    days have elapsed by 14 September 2026, so the ordinary 24-day return window applies and
    the return is accepted. The tier-A extension is not applicable and must not be mentioned
    to this non-tier-A account; the reply should not advertise the longer window.
- policy: order-reference-line
  obligation: ord-3324 named in the first sentence.
- policy: sign-off-house-style
