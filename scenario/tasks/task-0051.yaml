    request to use its own carrier; the reply must offer signed-for delivery as the alternative,
    without explaining carrier selection as a cost decision or inviting the customer to arrange
    their own collection.
- policy: order-reference-line
  obligation: ord-3457 named in the first sentence.
- policy: sign-off-house-style
