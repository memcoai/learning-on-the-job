# Fenmoor Supplies mock CRM: accounts.
#
# Authored against scenario/policies.yaml: tiers, tenures, credit statuses and
# group memberships are chosen so every policy's conditions are reachable,
# including the boundaries. Do not edit values without checking which policy
# combination a record exists to serve (noted in comments).
#
# Fields: tier A|B|C; credit_status ok|on-hold; tenure_years (whole years);
# status trading|closing; group (optional corporate group key);
# goodwill_credits (optional list of {date, amount}: the credits already
# granted, which the goodwill policy counts over a rolling twelve months).

