# Fenmoor Supplies mock ERP: orders.
#
# Authored against scenario/policies.yaml and accounts.yaml. Every order exists
# to make specific policy conditions reachable; boundaries are deliberate and
# noted. Do not edit values without checking the noted intent, and keep the
# arithmetic consistent: total_inc_vat = (goods_value_ex_vat +
# delivery_charge_ex_vat) * 1.2 throughout.
#
# reference_date is "today" for the whole scenario. The runner passes it to the
# agent and the reviewer; all window calculations (returns, damage reports)
# count from it.
#
# Order fields: status before-picking|picking|dispatched|delivered|
# awaiting-stock; payment_method card|invoice; credit_check completed|pending
# (present only where total_inc_vat > 4800); payments: list of
# {amount_inc_vat, settled, date}; lines: {description, category, quantity,
# unit_price_ex_vat, backorder_working_days?}. Categories: consumables,
# fixings, tools, storage, ppe, safety-ppe, calibration, special-order,
# cut-to-length.

