name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked fails the build if uv.lock has drifted from pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      # Every test runs offline against scripted providers and an in-memory
      # Memco client, so CI needs no API keys and no network.
      - name: Test
        run: uv run pytest
